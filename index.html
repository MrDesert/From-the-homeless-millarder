<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бомж-симулятор: Путь наверх</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="start" class="screen">
  <div class="start-card">
    <h1 id="startTitle"></h1>
    <div class="subtitle" id="startSubtitle"></div>
    <p id="startIntro"></p>
    <ul id="startRules"></ul>
    <button id="startBtn"></button>
    <button id="loadBtn" class="hidden"></button>
  </div>
</div>

<div id="charSelect" class="screen hidden">
  <div class="start-card">
    <h1 id="charTitle"></h1>
    <p id="charNote"></p>
    <div id="charList"></div>
    <button id="charBack"></button>
  </div>
</div>

<div id="game" class="screen hidden">
  <header>
    <div class="hleft">📅 <span id="dayLabel"></span> <span id="dayNum">1</span> · <span id="clock">08:00</span> · <span id="weather"></span></div>
    <div class="hmid"><span id="money"></span> ₽</div>
    <div class="hright">
      <button id="saveBtn"></button>
      <button id="resetBtn"></button>
    </div>
  </header>
  <main>
    <aside class="panel" id="statsPanel"></aside>
    <section>
      <!-- шкала занятости: только над портретом -->
      <div id="busyWrap" class="hidden">
        <div class="bwMain">
          <div id="busyLabel"></div>
          <div class="busybar"><div id="busyBar"></div></div>
          <div id="busyClock"></div>
        </div>
        <button id="busyStop"></button>
      </div>
      <div id="portraitWrap">
        <div id="portrait"></div>
        <div id="pCaption"></div>
        <div id="pMissing"></div>
      </div>
      <div class="panel">
        <div id="timeInfo"></div>
        <div id="actions"></div>
      </div>
    </section>
    <aside class="panel">
      <h3 id="logTitle"></h3>
      <div id="log"></div>
    </aside>
  </main>
</div>

<div id="modalWrap" class="hidden">
  <div id="modal">
    <button id="mClose" title="Закрыть">X</button>
    <h2 id="mTitle"></h2>
    <div id="mBody"></div>
    <div id="mBtns"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
